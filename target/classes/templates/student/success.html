<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Success - Aentic Exam Framework</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h3 class="text-center">Registration Successful!</h3>
                    </div>
                    <div class="card-body text-center">
                        <div class="alert alert-success">
                            <h4>Welcome, <span th:text="${student.fullName}">Student Name</span>!</h4>
                            <p>Your registration has been completed successfully.</p>
                        </div>
                        
                        <div class="row mt-4">
                            <div class="col-md-6">
                                <h5>Registration Details:</h5>
                                <table class="table table-bordered">
                                    <tr>
                                        <td><strong>Student ID:</strong></td>
                                        <td th:text="${student.id}">ID</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Email:</strong></td>
                                        <td th:text="${student.email}">Email</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Phone:</strong></td>
                                        <td th:text="${student.phone}">Phone</td>
                                    </tr>
                                    <tr>
                                        <td><strong>Registration Date:</strong></td>
                                        <td th:text="${#temporals.format(student.registrationDate, 'yyyy-MM-dd HH:mm')}">Date</td>
                                    </tr>
                                </table>
                            </div>
                            <div class="col-md-6">
                                <h5>Next Steps:</h5>
                                <div class="list-group">
                                    <a href="/topics/select" class="list-group-item list-group-item-action">
                                        <i class="bi bi-book"></i> Select Exam Topic
                                    </a>
                                    <a href="/exams/start?studentId=1&topicId=1" class="list-group-item list-group-item-action">
                                        <i class="bi bi-pencil-square"></i> Start Practice Exam
                                    </a>
                                    <a href="/reports" class="list-group-item list-group-item-action">
                                        <i class="bi bi-file-text"></i> View Reports
                                    </a>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4">
                            <a href="/topics/select" class="btn btn-primary btn-lg me-2">Select Topic & Start Exam</a>
                            <a href="/" class="btn btn-secondary btn-lg">Back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
