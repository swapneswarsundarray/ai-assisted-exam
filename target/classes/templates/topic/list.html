<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Topics - Aentic Exam Framework</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h2 class="text-center mb-4">Available Exam Topics</h2>
                
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Topic Name</th>
                                <th>Description</th>
                                <th>Difficulty</th>
                                <th>Duration</th>
                                <th>Questions</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="topic : ${topics}">
                                <td th:text="${topic.name}">Topic Name</td>
                                <td th:text="${topic.description}">Description</td>
                                <td>
                                    <span class="badge" th:class="'badge ' + (${topic.difficultyLevel} == 'BEGINNER' ? 'bg-success' : (${topic.difficultyLevel} == 'INTERMEDIATE' ? 'bg-warning' : 'bg-danger'))" 
                                          th:text="${topic.difficultyLevel}">Level</span>
                                </td>
                                <td th:text="${topic.durationMinutes} + ' min'">30 min</td>
                                <td th:text="${topic.questionCount}">10</td>
                                <td>
                                    <a th:href="@{/exams/start?studentId=1&topicId={topicId}(topicId=${topic.id})}" class="btn btn-primary btn-sm">Start Exam</a>
                                    <a th:href="@{/topics/{id}(id=${topic.id})}" class="btn btn-info btn-sm">View Details</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div th:if="${topics == null or topics.empty}" class="text-center">
                    <div class="alert alert-warning">
                        <h4>No Topics Available</h4>
                        <p>There are currently no exam topics available. Please check back later.</p>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <a href="/students/register" class="btn btn-secondary">Back to Registration</a>
                    <a href="/" class="btn btn-primary">Home</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
